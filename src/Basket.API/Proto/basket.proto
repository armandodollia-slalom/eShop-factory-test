syntax = "proto3";

option csharp_namespace = "eShop.Basket.API.Grpc";

package BasketApi;

service Basket {
    rpc GetBasket(GetBasketRequest) returns (CustomerBasketResponse) {}
    rpc UpdateBasket(UpdateBasketRequest) returns (CustomerBasketResponse) {}
    rpc DeleteBasket(DeleteBasketRequest) returns (DeleteBasketResponse) {}
    rpc SaveForLater(SaveForLaterRequest) returns (CustomerBasketResponse) {}
    rpc MoveToCart(MoveToCartRequest) returns (CustomerBasketResponse) {}
    rpc RemoveSavedItem(RemoveSavedItemRequest) returns (CustomerBasketResponse) {}
}

message GetBasketRequest {
}

message CustomerBasketResponse {
    repeated BasketItem items = 1;
    repeated BasketItem saved_items = 2;
}

message BasketItem {
    int32 product_id = 2;
    int32 quantity = 6;
}

message UpdateBasketRequest {
    repeated BasketItem items = 2;
}

message DeleteBasketRequest {
}

message DeleteBasketResponse {
}

message SaveForLaterRequest {
    int32 product_id = 1;
}

message MoveToCartRequest {
    int32 product_id = 1;
}

message RemoveSavedItemRequest {
    int32 product_id = 1;
}
