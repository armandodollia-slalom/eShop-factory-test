# Generated by `factory render`. Do not edit.
name: Board escalation resolve

# A ticket the pipeline moved to Failed gets a comment with questions and a **Resolved** checkbox
# (`board fail`). Ticking it edits the comment; this workflow checks the answers and either unticks it
# with what is missing, or swaps `needs-human` for `escalation-resolved` and records the answers under
# `## Decisions` in the issue body. A human adding `escalation-resolved` by hand counts too. The card goes
# back to Ready at the next `board sync` on a pipeline machine, so no project token is needed here.
# Only edits trigger it, not new comments: every comment on every issue and PR would otherwise start a run
# (the review gate and the board post many). A `Qn:` reply is read when Resolved is ticked (or re-ticked).
# See docs/ai-pipeline/escalations.md.
on:
  issue_comment:
    types: [edited]
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: board-escalation-${{ github.event.issue.number }}

jobs:
  resolve:
    # Comments: the failure comment itself, edited (Resolved ticked), never by a bot.
    # Labels: a human adding escalation-resolved.
    # Only people with a role in the repository: on a public repository anyone can comment, and this job
    # holds FACTORY_TOKEN.
    if: >-
      !endsWith(github.event.sender.login, '[bot]') &&
      (github.event_name != 'issue_comment' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) && (
        (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
          contains(github.event.comment.body, 'pipeline-escalation:')) ||
        (github.event_name == 'issues' && github.event.label.name == 'escalation-resolved')
      )
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - uses: ./.github/actions/setup-factory
      with:
        token: ${{ secrets.FACTORY_TOKEN }}
    - name: Check the answers
      env:
        GH_TOKEN: ${{ github.token }}
        ISSUE: ${{ github.event.issue.number }}
        ACTOR: ${{ github.event.sender.login }}
        COMMENT: ${{ github.event_name == 'issue_comment' && contains(github.event.comment.body, 'pipeline-escalation:') && github.event.comment.id || '' }}
        VIA_LABEL: ${{ github.event_name == 'issues' && '--label' || '' }}
      run: factory board resolve-check "$ISSUE" --actor "$ACTOR" ${COMMENT:+--comment "$COMMENT"} $VIA_LABEL
