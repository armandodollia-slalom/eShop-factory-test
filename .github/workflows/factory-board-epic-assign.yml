# Generated by `factory render`. Do not edit.
name: Board epic assignment

# Assigning (or unassigning) an epic issue gives all of its open stories the same assignees, so
# `board mine` lists them for the engineer who runs the epic. See docs/ai-pipeline/board.md.
on:
  issues:
    types: [assigned, unassigned]

permissions:
  contents: read
  issues: write

concurrency:
  group: board-epic-${{ github.event.issue.number }}

jobs:
  sync:
    if: contains(github.event.issue.labels.*.name, 'epic')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - uses: ./.github/actions/setup-factory
      with:
        token: ${{ secrets.FACTORY_TOKEN }}
    - name: Give the epic's stories its assignees
      env:
        GH_TOKEN: ${{ github.token }}
        EPIC: ${{ github.event.issue.number }}
      run: factory board sync-epic "$EPIC"
