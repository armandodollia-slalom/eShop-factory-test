# Generated by `factory render`. Do not edit.
name: AI app factory

# The called feature verification check reads story issues; a called workflow cannot get more than its caller.
permissions:
  contents: read
  issues: read

# The factory's pull request gate, without any LLM call: the generated files are in step with the
# engine version this repository pins, the configured models are allowed, then each stage's own gate.
on:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - uses: ./.github/actions/setup-factory
      with:
        token: ${{ secrets.FACTORY_TOKEN }}
    - name: Generated files are in step (never edited by hand)
      run: factory check
    - name: Configured models are allowed (agent.allowedModels)
      run: factory models check

  feature-verification:
    needs: pipeline
    uses: ./.github/workflows/factory-feature-verification-check.yml
    secrets: inherit
    with:
      base-ref: origin/${{ github.base_ref }}
