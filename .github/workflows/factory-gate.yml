# Generated by `factory render`. Do not edit.
name: AI app factory

# The called feature verification check reads story issues; a called workflow cannot get more than its caller.
permissions:
  contents: read
  issues: read

# The factory's pull request gate, without any LLM call: the generated files are in step with the
# engine version this repository pins, the configured models are allowed, then each stage's own gate.
on:
  pull_request:

  push:
    branches:
    - feat/**
    - epic/**
    - bugfix/**
jobs:
  reuse:
    name: reuse
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      reused: ${{ steps.check.outputs.reused }}
    steps:
    - id: check
      name: The same jobs already passed on this head before the PR opened
      env:
        GH_TOKEN: ${{ github.token }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        ALLOW_SKIPPED: ""
      run: |-
        set -u
        wf="${WORKFLOW_REF#*/*/}"; wf="${wf%@*}"
        reused=false
        behind=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_REF...$HEAD_SHA" --jq .behind_by 2>/dev/null || echo unknown)
        run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&event=push&per_page=50" --jq "[.workflow_runs[] | select(.path == \"$wf\" and .conclusion == \"success\")][0].id // empty" 2>/dev/null || true)
        if [ "$behind" = "0" ] && [ -n "$run" ]; then
          open=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" --jq "[.jobs[] | . as \$j | select(\$j.name != \"reuse\" and \$j.conclusion != \"success\" and ((\$j.conclusion == \"skipped\" and ((env.ALLOW_SKIPPED // \"\") | split(\",\") | index(\$j.name) != null)) | not))] | length" 2>/dev/null || echo 1)
          if [ "$open" = "0" ]; then reused=true; echo "Every job of $wf passed on $HEAD_SHA in its story-branch push run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run (reused, not repeated)"; fi
        fi
        [ "$reused" = true ] || echo "No complete green push run of $wf on $HEAD_SHA with the base not ahead (behind_by=$behind, run=${run:-none}): the jobs run in full"
        echo "reused=$reused" >> "$GITHUB_OUTPUT"
  pipeline:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - uses: ./.github/actions/setup-factory
      with:
        token: ${{ secrets.FACTORY_TOKEN }}
    - name: Generated files are in step (never edited by hand)
      run: factory check
    - name: Configured models are allowed (agent.allowedModels)
      run: factory models check
    - name: "Toolchain (yours: .github/actions/factory-toolchain), for a stack published from the application"
      if: hashFiles('.factory/stack/**') != '' && hashFiles('.github/actions/factory-toolchain/action.yml') != ''
      uses: ./.github/actions/factory-toolchain
    - name: Test stack scenarios parse, and the stack matches the application
      if: hashFiles('.factory/stack/**') != ''
      run: |
        factory teststack validate
        if node -e "process.exit(require('./.factory/config.json').teststack?.commands?.drift ? 0 : 1)"; then factory teststack drift; fi
    needs:
    - reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}

  policy:
    # The architecture policy's own checks, as the review stage applies them: the application's declarations
    # (.factory/app.json policy), every project classified (by the profile or by its classification conventions),
    # the conventions agreeing with the profile, linked-source folders profiled, the rules and validators valid.
    # The toolchain lets the engine confirm a new project's facts with the build tool (MSBuild); without it, selfcheck
    # says so and a new project the profile does not list goes to a person.
    # (hashFiles is only available in step conditions, so each step checks for the policy.)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      if: hashFiles('.factory/policy/policy.yaml') != ''
      with:
        node-version: 20.x
    - uses: ./.github/actions/setup-factory
      if: hashFiles('.factory/policy/policy.yaml') != ''
      with:
        token: ${{ secrets.FACTORY_TOKEN }}
    - name: "Toolchain (yours: .github/actions/factory-toolchain), so the policy can ask the build tool to confirm a new project's facts"
      if: hashFiles('.factory/policy/policy.yaml') != '' && hashFiles('.github/actions/factory-toolchain/action.yml') != ''
      uses: ./.github/actions/factory-toolchain
    - name: Python for the policy engine
      if: hashFiles('.factory/policy/policy.yaml') != ''
      run: factory python setup
    - name: Architecture policy selfcheck
      if: hashFiles('.factory/policy/policy.yaml') != ''
      run: factory arch selfcheck --policy-dir .factory/policy --workspace .
    needs:
    - reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}

  lint:
    # The repository's linters (precheck.lint) on the lines this pull request changes.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - uses: ./.github/actions/setup-factory
      with:
        token: ${{ secrets.FACTORY_TOKEN }}
    - name: "Toolchain (yours: .github/actions/factory-toolchain)"
      if: hashFiles('.github/actions/factory-toolchain/action.yml') != ''
      uses: ./.github/actions/factory-toolchain
    - name: Lint the changed lines
      env:
        BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
      run: factory lint --base "origin/$BASE_REF"
    needs:
    - reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}

  feature-verification:
    needs:
    - reuse
    - pipeline
    uses: ./.github/workflows/factory-feature-verification-check.yml
    secrets: inherit
    with:
      base-ref: origin/${{ github.base_ref || github.event.repository.default_branch }}
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}
