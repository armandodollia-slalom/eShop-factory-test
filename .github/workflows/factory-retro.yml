# Generated by `factory render`. Do not edit.
name: feature verification lessons

# Turns recurring denials into lessons for the agents (verifier denials and calibration misses for
# the feature verification agents and verifiers; architecture review findings, product bugs and PR check findings for
# the implementer), runs the factory retro over the decision log (.factory/metrics/decisions.jsonl),
# then opens a pull request with the changes for human review.
# Manual only for now; run it locally with `factory fv calibrate|metrics|lessons`.
on:
  workflow_dispatch:
    inputs:
      calibrate:
        description: Re-audit recent 10/10 verdicts before computing lessons
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: retro
  cancel-in-progress: false

jobs:
  lessons:
    runs-on: ubuntu-latest
    env:
      # Agent provider: repository variable PIPELINE_AGENT_CLI (claude, the default, copilot or codex),
      # or PIPELINE_AGENT_CMD for any other CLI. See docs/ai-pipeline/setup.md#ci.
      PIPELINE_AGENT_CLI: ${{ vars.PIPELINE_AGENT_CLI }}
      PIPELINE_AGENT_CMD: ${{ vars.PIPELINE_AGENT_CMD }}
      PIPELINE_AGENT_INSTALL: ${{ vars.PIPELINE_AGENT_INSTALL }}
      PIPELINE_AGENT_API_KEY: ${{ secrets.PIPELINE_AGENT_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      PIPELINE_BASE_REF: origin/${{ github.event.repository.default_branch }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - uses: ./.github/actions/setup-factory
      with:
        token: ${{ secrets.FACTORY_TOKEN }}
    - name: Install agent CLI
      id: agent
      uses: ./.github/actions/setup-agent-cli
    - name: Configure git
      if: steps.agent.outputs.ready == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
    - name: Calibrate verifiers
      if: steps.agent.outputs.ready == 'true' && inputs.calibrate
      run: factory retro calibrate --sample 3
    - name: Metrics
      if: steps.agent.outputs.ready == 'true'
      run: factory fv metrics | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Propose lessons
      if: steps.agent.outputs.ready == 'true'
      run: factory retro run