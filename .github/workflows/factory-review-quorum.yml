# Generated by `factory render`. Do not edit.
name: review-quorum

# The review gate (docs/ai-pipeline/review-gate.md) labels a bug-fix PR that needs people `approvals:N`.
# GitHub rulesets set one approval count per branch, not per PR, so this check enforces the count per PR:
# it passes once approvals from distinct people (not the author, not stale approvals from before the
# latest push) reach N. A PR without the label, or with `approvals:0`, passes.
#
# Making it a required check on main is a repository setting (Settings > Rules > Rulesets, "Require
# status checks to pass": review-quorum); this workflow does not change any setting.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: review-quorum-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-quorum:
    name: review-quorum
    runs-on: ubuntu-latest
    steps:
    # The check's code comes from the base branch, so a PR cannot change how its own approvals are counted.
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        # The factory's pin and settings, and the action that installs the pinned engine.
        sparse-checkout: |
          .factory
          .github/actions
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
    # Until the factory is on the base branch (the PR that adds it), there is nothing to enforce.
    - uses: ./.github/actions/setup-factory
      if: hashFiles('.factory/factory.json') != ''
      with:
        token: ${{ secrets.FACTORY_TOKEN }}
    - name: Count approvals
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        # Until the factory is on the base branch (the PR that adds it), there is nothing to enforce.
        if [ ! -f .factory/factory.json ]; then echo "review-quorum: the factory is not on the base branch yet; nothing to enforce"; exit 0; fi
        factory review-quorum "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
