# Generated by `factory render` from the analysis CI jobs in .factory/config.json. Do not edit.
name: factory-analysis

# Read access only: the scanners get no token and no secret.
permissions:
  contents: read

on:
  pull_request:

jobs:
  secrets:
    name: "Secret scan"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 20.x
    - name: "Secret scan"
      env:
        BASE_REF: ${{ github.base_ref }}
      run: FACTORY_CACHE_DIR="$RUNNER_TEMP/factory-cache" node .factory/bin/analysis/ci.mjs --job secrets --base "origin/$BASE_REF"
  dependencies:
    name: "Dependency audit"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 20.x
    - name: "Toolchain (yours: .github/actions/factory-toolchain)"
      if: hashFiles('.github/actions/factory-toolchain/action.yml') != ''
      uses: ./.github/actions/factory-toolchain
    - name: "Dependency audit"
      env:
        BASE_REF: ${{ github.base_ref }}
      run: FACTORY_CACHE_DIR="$RUNNER_TEMP/factory-cache" node .factory/bin/analysis/ci.mjs --job dependencies --base "origin/$BASE_REF"
  sast:
    name: "Security patterns (SAST)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 20.x
    - name: "Security patterns (SAST)"
      env:
        BASE_REF: ${{ github.base_ref }}
      run: FACTORY_CACHE_DIR="$RUNNER_TEMP/factory-cache" node .factory/bin/analysis/ci.mjs --job sast --base "origin/$BASE_REF"
  workflows:
    name: "Workflow lint"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 20.x
    - name: "Workflow lint"
      env:
        BASE_REF: ${{ github.base_ref }}
      run: FACTORY_CACHE_DIR="$RUNNER_TEMP/factory-cache" node .factory/bin/analysis/ci.mjs --job workflows --base "origin/$BASE_REF"
