# Generated by `factory render`. Do not edit.
name: feature verification check

permissions:
  contents: read
  issues: read

# feature verification stage gate, called by ai-pipeline.yml:
# - stories touched by the PR (plan or scenario folders, tests with their case ids, keys in the branch
#   or commit messages) have a test plan that passed the plan verifier (10/10) for the current story text
# - automated tests and scenarios for those stories passed the automation verifier and were not edited afterwards
on:
  workflow_call:
    inputs:
      base-ref:
        description: Ref to diff against, for example origin/main
        type: string
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - uses: ./.github/actions/setup-factory
      with:
        token: ${{ secrets.FACTORY_TOKEN }}
    - name: Story plans and tests are verifier-approved
      env:
        BASE_REF: ${{ inputs.base-ref }}
        # Stories are board issues: the check fetches the touched ones (read-only) to compare story-sha.
        GH_TOKEN: ${{ github.token }}
      run: factory fv check --changed-from "$BASE_REF"
