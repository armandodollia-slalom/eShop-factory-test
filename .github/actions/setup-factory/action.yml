# Generated by `factory render`. Do not edit.
name: Set up the AI app factory
description: >
  Installs the factory engine this repository is pinned to (.factory/factory.json: source and version)
  and puts `factory` on PATH. Generated by `factory render`; do not edit.
inputs:
  token:
    description: >
      A token that can read the factory repository, for a private factory (the FACTORY_TOKEN secret: a
      fine-grained token with Contents read on that repository). Empty for a public factory.
    required: false
    default: ''
runs:
  using: composite
  steps:
  - shell: bash
    env:
      FACTORY_TOKEN: ${{ inputs.token }}
    run: |
      version=$(node -p "require('./.factory/factory.json').version")
      source=$(node -p "require('./.factory/factory.json').source || ''")
      if [ -z "$source" ]; then echo "::error::.factory/factory.json has no \"source\" (the factory's git URL)"; exit 1; fi
      dest="$RUNNER_TEMP/ai-app-factory"
      auth=()
      if [ -n "$FACTORY_TOKEN" ]; then
        echo "::add-mask::$FACTORY_TOKEN"
        auth=(-c "http.extraHeader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FACTORY_TOKEN" | base64 | tr -d '\n')")
      fi
      if ! git "${auth[@]}" clone --quiet --depth 1 --branch "v$version" "$source" "$dest"; then
        echo "::error::could not clone the factory v$version from $source. A private factory needs the FACTORY_TOKEN secret (Contents: read on that repository); the tag v$version must exist there."
        exit 1
      fi
      # Not --silent: when the install fails, the log must say why.
      if [ -f "$dest/package-lock.json" ]; then (cd "$dest" && npm ci --omit=dev --no-audit --no-fund --loglevel=error); fi
      echo "$dest/bin" >> "$GITHUB_PATH"
      echo "FACTORY_HOME=$dest" >> "$GITHUB_ENV"
