# Generated by `factory render`. Do not edit.
name: Set up the pipeline's agent CLI
description: >
  Installs the agent CLI chosen by PIPELINE_AGENT_CLI (claude, copilot or codex), or runs
  PIPELINE_AGENT_INSTALL for a custom PIPELINE_AGENT_CMD, and reports whether a credential is available.
  The calling job sets these variables and the credentials in its env (see docs/ai-pipeline/setup.md#ci).
outputs:
  ready:
    description: "'true' when the agent CLI is installed and has a credential"
    value: ${{ steps.setup.outputs.ready }}
runs:
  using: composite
  steps:
  - id: setup
    shell: bash
    run: |
      cli="${PIPELINE_AGENT_CLI:-claude}"
      skip() { echo "::notice::$1; skipping."; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; }
      if [ -n "$PIPELINE_AGENT_CMD" ]; then
        if [ -n "$PIPELINE_AGENT_INSTALL" ]; then bash -c "$PIPELINE_AGENT_INSTALL"; fi
        echo "Agent: custom command"
      else
        case "$cli" in
          claude)
            [ -n "$ANTHROPIC_API_KEY" ] || skip "PIPELINE_AGENT_CLI is claude but the ANTHROPIC_API_KEY secret is not set"
            npm i -g @anthropic-ai/claude-code ;;
          copilot)
            # The COPILOT_GITHUB_TOKEN secret when set, else the workflow's GITHUB_TOKEN (needs the
            # copilot-requests permission and the organization's Copilot CLI policy).
            [ -n "$COPILOT_GITHUB_TOKEN" ] || [ -n "$GH_TOKEN" ] || [ -n "$GITHUB_TOKEN" ] || skip "PIPELINE_AGENT_CLI is copilot but no GitHub token is available"
            npm i -g @github/copilot ;;
          codex)
            [ -n "$CODEX_API_KEY" ] || skip "PIPELINE_AGENT_CLI is codex but the OPENAI_API_KEY secret is not set"
            npm i -g @openai/codex ;;
          *)
            echo "::error::Unknown PIPELINE_AGENT_CLI '$cli'. Use claude, copilot, codex or set PIPELINE_AGENT_CMD."
            exit 1 ;;
        esac
        echo "Agent: $cli"
      fi
      echo "ready=true" >> "$GITHUB_OUTPUT"
