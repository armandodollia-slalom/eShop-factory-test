# The factory's own rule (MIT). Written for the AI app factory from the defect description; not derived from any rule set.
rules:
  - id: factory.cs.process-from-input
    languages: [csharp]
    severity: ERROR
    message: >-
      A process is started with a program or argument string that is not fixed. A value from a request can run another
      program or add arguments (command injection). Start a fixed program and pass each argument through
      ProcessStartInfo.ArgumentList.
    metadata: { cwe: "CWE-78", category: security, licence: MIT, source: ai-app-factory }
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: Process.Start((string $P), ...)
              - pattern: Process.Start($F, (string $P))
              - pattern: System.Diagnostics.Process.Start((string $P), ...)
          - metavariable-pattern:
              metavariable: $P
              patterns:
                - pattern-not: |
                    "..."
                - pattern-not: new ProcessStartInfo(...) { ... }
                - pattern-not: new ProcessStartInfo(...)
      - patterns:
          - pattern-either:
              - pattern: new ProcessStartInfo($P, ...)
              - pattern: new ProcessStartInfo($F, $P)
              - pattern: $PSI.FileName = $P
              - pattern: $PSI.Arguments = $P
          - metavariable-pattern:
              metavariable: $P
              patterns:
                - pattern-not: |
                    "..."
