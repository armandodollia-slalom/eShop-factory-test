# The factory's own rule (MIT). Written for the AI app factory from the defect description; not derived from any rule set.
rules:
  - id: factory.cs.ssrf-from-request
    languages: [csharp]
    severity: ERROR
    message: >-
      The server requests a URL that comes from a request value. A caller can make it reach internal services or cloud
      metadata endpoints (server-side request forgery). Allow only known hosts, or map the input to a fixed URL.
    metadata: { cwe: "CWE-918", category: security, licence: MIT, source: ai-app-factory }
    # Test code drives the application from outside: a test client's request and response are not the server's input
    # (dogfood C15: Playwright specs failed CI on SQL and SSRF rules). Secrets in tests are still the secret scan's.
    paths:
      exclude: ["e2e/**", "**/e2e/**", "tests/**", "test/**", "**/*.spec.*", "**/*.test.*", "**/*Tests/**", "**/*.Tests/**"]
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              $RT $M(..., [$A] $T $P, ...) { ... }
          - metavariable-regex:
              metavariable: $A
              regex: ^From(Query|Route|Form|Header|Body)
          - pattern: $P
      - pattern: Request.Query[...]
      - pattern: Request.Form[...]
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $C.GetAsync($URL, ...)
              - pattern: $C.GetStringAsync($URL, ...)
              - pattern: $C.GetStreamAsync($URL, ...)
              - pattern: $C.GetByteArrayAsync($URL, ...)
              - pattern: $C.PostAsync($URL, ...)
              - pattern: $C.GetFromJsonAsync<$X>($URL, ...)
              - pattern: new HttpRequestMessage($METHOD, $URL)
              - pattern: new Uri($URL)
              - pattern: WebRequest.Create($URL)
          - focus-metavariable: $URL
