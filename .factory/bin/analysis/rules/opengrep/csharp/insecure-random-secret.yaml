# The factory's own rule (MIT). Written for the AI app factory from the defect description; not derived from any rule set.
rules:
  - id: factory.cs.insecure-random-secret
    languages: [csharp]
    severity: ERROR
    message: >-
      System.Random makes a value that is used as a secret (a token, password, key, salt, nonce or code). Its output can be
      predicted. Use RandomNumberGenerator (GetBytes, GetInt32, GetHexString).
    metadata: { cwe: "CWE-338", category: security, licence: MIT, source: ai-app-factory }
    # Test code drives the application from outside: a test client's request and response are not the server's input
    # (dogfood C15: Playwright specs failed CI on SQL and SSRF rules). Secrets in tests are still the secret scan's.
    paths:
      exclude: ["e2e/**", "**/e2e/**", "tests/**", "test/**", "**/*.spec.*", "**/*.test.*", "**/*Tests/**", "**/*.Tests/**"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $T $NAME = <... $R.$M(...) ...>;
              - pattern: var $NAME = <... $R.$M(...) ...>;
              - pattern: $NAME = <... $R.$M(...) ...>
          - pattern-either:
              - pattern-inside: |
                  $RT $F(...) { ... var $R = new Random(...); ... }
              - pattern-inside: |
                  $RT $F(...) { ... Random $R = new Random(...); ... }
          - metavariable-regex:
              metavariable: $M
              regex: ^Next
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i).*(token|secret|passw|pwd|apikey|salt|nonce|otp|session|reset|csrf|key$)
      - patterns:
          - pattern-either:
              - pattern: $T $NAME = <... Random.Shared.$M(...) ...>;
              - pattern: var $NAME = <... Random.Shared.$M(...) ...>;
              - pattern: $T $NAME = <... new Random(...).$M(...) ...>;
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i).*(token|secret|passw|pwd|apikey|salt|nonce|otp|session|reset|csrf|key$)
