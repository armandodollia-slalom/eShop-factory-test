# The factory's own rule (MIT). Written for the AI app factory from the defect description; not derived from any rule set.
rules:
  - id: factory.cs.tls-verification-off
    languages: [csharp]
    severity: ERROR
    message: >-
      A certificate validation callback accepts every certificate. Anyone on the network path can impersonate the server
      (man in the middle). Remove the callback, or check the certificate against a known thumbprint or CA.
    metadata: { cwe: "CWE-295", category: security, licence: MIT, source: ai-app-factory }
    # Test code drives the application from outside: a test client's request and response are not the server's input
    # (dogfood C15: Playwright specs failed CI on SQL and SSRF rules). Secrets in tests are still the secret scan's.
    paths:
      exclude: ["e2e/**", "**/e2e/**", "tests/**", "test/**", "**/*.spec.*", "**/*.test.*", "**/*Tests/**", "**/*.Tests/**"]
    pattern-either:
      - pattern: $X.ServerCertificateCustomValidationCallback = (...) => true
      - pattern: $X.ServerCertificateValidationCallback = (...) => true
      - pattern: $X.RemoteCertificateValidationCallback = (...) => true
      - pattern: ServicePointManager.ServerCertificateValidationCallback = (...) => true
      - pattern: ServicePointManager.ServerCertificateValidationCallback += (...) => true
      - pattern: HttpClientHandler.DangerousAcceptAnyServerCertificateValidator
      - pattern: |
          ServerCertificateCustomValidationCallback = (...) => true
