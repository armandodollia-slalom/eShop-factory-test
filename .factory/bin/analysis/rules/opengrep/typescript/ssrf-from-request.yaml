# The factory's own rule (MIT). Written for the AI app factory from the defect description; not derived from any rule set.
rules:
  - id: factory.ts.ssrf-from-request
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      The server fetches a URL that comes from the request. A caller can make it reach internal services or cloud
      metadata endpoints (server-side request forgery). Allow only known hosts, or map the input to a fixed URL.
    metadata: { cwe: "CWE-918", category: security, licence: MIT, source: ai-app-factory }
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.params
          - pattern: $REQ.query
          - pattern: $REQ.body
          - pattern: $REQ.headers
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($URL, ...)
              - pattern: $AX.get($URL, ...)
              - pattern: $AX.post($URL, ...)
              - pattern: $AX.request($URL, ...)
              - pattern: $H.get($URL, ...)
              - pattern: $H.request($URL, ...)
              - pattern: axios($URL, ...)
              - pattern: got($URL, ...)
          - focus-metavariable: $URL
