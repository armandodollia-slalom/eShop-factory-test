# The factory's own rule (MIT). Written for the AI app factory from the defect description; not derived from any rule set.
rules:
  - id: factory.ts.insecure-random-secret
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Math.random() makes a value that is used as a secret (a token, password, key, salt, nonce or code). Its output can be
      predicted. Use crypto.randomBytes, crypto.randomUUID or crypto.getRandomValues.
    metadata: { cwe: "CWE-338", category: security, licence: MIT, source: ai-app-factory }
    # Test code drives the application from outside: a test client's request and response are not the server's input
    # (dogfood C15: Playwright specs failed CI on SQL and SSRF rules). Secrets in tests are still the secret scan's.
    paths:
      exclude: ["e2e/**", "**/e2e/**", "tests/**", "test/**", "**/*.spec.*", "**/*.test.*", "**/*Tests/**", "**/*.Tests/**"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $NAME = <... Math.random() ...>
              - pattern: |
                  {..., $NAME: <... Math.random() ...>, ...}
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i).*(token|secret|passw|pwd|apikey|api_key|salt|nonce|otp|session|reset|csrf|key$)
      - patterns:
          - pattern-inside: |
              function $NAME(...) { ... }
          - pattern: Math.random()
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i).*(token|secret|passw|pwd|apikey|api_key|salt|nonce|otp|session|reset|csrf|key$)
      - patterns:
          - pattern-inside: |
              $NAME = (...) => { ... }
          - pattern: Math.random()
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i).*(token|secret|passw|pwd|apikey|api_key|salt|nonce|otp|session|reset|csrf|key$)
