# The factory's own rule (MIT). Written for the AI app factory from the defect description; not derived from any rule set.
rules:
  - id: factory.ts.insecure-random-secret
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Math.random() makes a value that is used as a secret (a token, password, key, salt, nonce or code). Its output can be
      predicted. Use crypto.randomBytes, crypto.randomUUID or crypto.getRandomValues.
    metadata: { cwe: "CWE-338", category: security, licence: MIT, source: ai-app-factory }
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $NAME = <... Math.random() ...>
              - pattern: |
                  {..., $NAME: <... Math.random() ...>, ...}
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i).*(token|secret|passw|pwd|apikey|api_key|salt|nonce|otp|session|reset|csrf|key$)
      - patterns:
          - pattern-inside: |
              function $NAME(...) { ... }
          - pattern: Math.random()
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i).*(token|secret|passw|pwd|apikey|api_key|salt|nonce|otp|session|reset|csrf|key$)
      - patterns:
          - pattern-inside: |
              $NAME = (...) => { ... }
          - pattern: Math.random()
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i).*(token|secret|passw|pwd|apikey|api_key|salt|nonce|otp|session|reset|csrf|key$)
