# The factory's own rule (MIT). Written for the AI app factory from the defect description; not derived from any rule set.
rules:
  - id: factory.ts.process-from-input
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A shell command is run with a value that is not a fixed string. A value from a request can add its own commands
      (command injection). Run the program with execFile/spawn and an argument array, without a shell.
    metadata: { cwe: "CWE-78", category: security, licence: MIT, source: ai-app-factory }
    pattern-either:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: $CP.exec($CMD, ...)
                      - pattern: $CP.execSync($CMD, ...)
                  - metavariable-regex:
                      metavariable: $CP
                      regex: (?i)^(cp|child_?process|child|proc|shell)$
              - pattern: require("child_process").exec($CMD, ...)
              - pattern: require("child_process").execSync($CMD, ...)
              - pattern: exec($CMD, ...)
              - pattern: execSync($CMD, ...)
          - metavariable-pattern:
              metavariable: $CMD
              patterns:
                - pattern-not: |
                    "..."
      - patterns:
          - pattern-either:
              - pattern: |
                  $CP.spawn($CMD, $ARGS, {..., shell: true, ...})
              - pattern: |
                  spawn($CMD, $ARGS, {..., shell: true, ...})
          - metavariable-pattern:
              metavariable: $CMD
              patterns:
                - pattern-not: |
                    "..."
