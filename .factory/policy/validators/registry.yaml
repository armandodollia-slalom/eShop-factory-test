# Validator registry: the engine's validator implementations (module:function), configured for this codebase.
# Rules reference these IDs. Deterministic validators must ship >= 2 self-tests (one that passes, one that
# fails); `arch.py selfcheck` runs them in memory. A self-test may carry a `profile:` block that replaces
# profile keys for that test, so it does not depend on the real project list.
#
# Implementations the engine provides (see docs/architecture-policy.md for their params):
#   text_validators:forbidden_pattern          a regex that must not occur
#   text_validators:required_pattern           a regex that must occur (in the file or anywhere in its project)
#   project_validators:layer_dependencies      profile.layer_dependencies over build manifests
#   project_validators:service_isolation       no project reference across services
#   project_validators:forbidden_packages      profile.forbidden_packages_by_layer over build manifests
#   data_validators:database_ownership         a service connects only to datastores it owns
#   data_validators:migration_immutability     existing migrations are never edited or deleted
#   change_validators:tests_accompany_changes  profile.test_mapping: source changes come with test changes
#   evidence_validators:test_results           supplied JUnit/TRX results are green
#   evidence_validators:coverage_threshold     Cobertura line coverage meets a minimum
#   semantic_validators:semantic_review        a rubric judged by a reviewer (LLM or human)
kind: ValidatorRegistry
schema_version: 1
validators:

  - id: VAL-SECRET-SCAN
    name: Secret scan
    type: deterministic
    implementation: text_validators:forbidden_pattern
    description: Rejects private keys, cloud access key IDs and quoted credential literals in source and configuration.
    checkpoints: [pre_commit, code_review, ci]
    params:
      ignore_comments: false
      patterns:
        - regex: '-----BEGIN (?:[A-Z]+ )?PRIVATE KEY-----'
          message: A private key is committed. Remove it, rotate it and load it from a secret store.
        - regex: '\bAKIA[0-9A-Z]{16}\b'
          message: An AWS access key ID is committed. Remove it, rotate it and use the platform's credential provider.
        # A value that is a lowercase snake/kebab/dotted name ("access_token", "client-secret") is a key or
        # claim name, not a credential.
        - regex: '(?:password|passwd|pwd|secret|api[_-]?key|access[_-]?token|client[_-]?secret)["'']?\s*[:=]\s*["''](?![a-z]+(?:[_.-][a-z]+)+["''])[^"''\s${}<>]{8,}["'']'
          flags: [i]
          message: A credential literal is committed. Read it from the environment or a secret store.
    self_tests:
      - name: hard-coded password fails
        files:
          app/settings.conf: 'db_password = "S3cr3t-Pa55word!"'
        expect: fail
      - name: value from the environment passes
        files:
          app/settings.conf: 'db_password = env("DB_PASSWORD")'
        expect: pass
      - name: placeholder passes
        files:
          app/settings.conf: 'db_password = "${DB_PASSWORD}"'
        expect: pass
      - name: a key or claim name is not a credential
        files:
          app/Settings.cs: 'private const string AccessToken = "access_token";'
        expect: pass
      - name: a lowercase secret with digits still fails
        files:
          app/settings.conf: 'api_key = "hunter2hunter2"'
        expect: fail

  - id: VAL-GENERATED-MARKER
    name: Generated-code marker
    type: deterministic
    implementation: text_validators:forbidden_pattern
    description: Flags changed files that carry a generated-code marker; such files are regenerated, not edited.
    checkpoints: [pre_commit, code_review]
    params:
      ignore_comments: false
      max_per_file: 1
      patterns:
        - regex: '\bdo not edit\b|@generated\b|<auto-?generated\b|\bautogenerated\b'
          flags: [i]
          message: This file carries a generated-code marker. Change its source or the generator and regenerate it; if you did, say so in the change description.
    self_tests:
      - name: changed generated file fails
        files:
          app/gen/client.txt: "// Code generated by the API generator. DO NOT EDIT.\nclient = 1\n"
        expect: fail
        expect_count: 1
      - name: hand-written file passes
        files:
          app/client.txt: "client = 1\n"
        expect: pass

  - id: VAL-DB-OWNERSHIP
    name: Datastore ownership
    type: deterministic
    implementation: data_validators:database_ownership
    description: A file of one service must not name a datastore that profile.services says another service owns.
    checkpoints: [pre_commit, code_review, ci]
    params:
      # How this codebase names the datastore it connects to; the named group 'name' is looked up in
      # profile.services[].owns_datastores. Add the forms your stack uses (a config key, a client constructor).
      connection_patterns:
        # Aspire client integrations and EF Core: AddNpgsqlDbContext<T>("catalogdb"), GetConnectionString("orderingdb"), AddRedisClient("redis").
        - 'Add(?:Npgsql|Azure)?\w*(?:DbContext|DataSource|Client)(?:<[^>]+>)?\(\s*"(?P<name>[A-Za-z0-9_-]+)"'
        - 'GetConnectionString\(\s*"(?P<name>[A-Za-z0-9_-]+)"'
        - '(?i)\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|sqlserver|redis)://[^\s"''/]*/(?P<name>[A-Za-z0-9_-]+)'
        - '(?i)\b(?:database|dbname|initial catalog)\s*=\s*(?P<name>[A-Za-z0-9_-]+)'
    self_tests:
      - name: connecting to another service's database fails
        profile: &two_services
          projects:
            - { name: orders,  path: services/orders,  type: api, service: orders }
            - { name: billing, path: services/billing, type: api, service: billing }
          services:
            - { id: orders,  owns_datastores: [ordersdb],  traits: [owns_database] }
            - { id: billing, owns_datastores: [billingdb], traits: [owns_database] }
        files:
          services/orders/config.txt: 'url = "postgres://db.internal:5432/billingdb"'
        expect: fail
      - name: connecting to the own database passes
        profile: *two_services
        files:
          services/orders/config.txt: 'url = "postgres://db.internal:5432/ordersdb"'
        expect: pass

  - id: VAL-TESTS-ACCOMPANY-CHANGES
    name: Tests accompany source changes
    type: deterministic
    implementation: change_validators:tests_accompany_changes
    description: Uses profile.test_mapping to require a test change alongside a source change in a mapped tree.
    checkpoints: [code_review, testing, ci]
    params:
      # Changes that never need a test.
      # eShop: package bumps (csproj), request samples (.http) and settings files carry no behaviour a test could pin.
      ignore_globs: ["**/*.md", "**/*.txt", "**/*.lock", "**/*.csproj", "**/*.http", "**/appsettings*.json", "**/Properties/launchSettings.json"]
    self_tests:
      - name: source change without tests fails
        profile: &mapped
          test_mapping:
            - { source: services/orders/src, tests: ["services/orders/tests/**"] }
        files:
          services/orders/src/order.code: "change"
        changed: { services/orders/src/order.code: M }
        expect: fail
      - name: a package bump in a csproj needs no test
        profile: *mapped
        files:
          services/orders/src/Orders.csproj: "<Project />"
        changed: { services/orders/src/Orders.csproj: M }
        expect: pass
      - name: source change with tests passes
        profile: *mapped
        files:
          services/orders/src/order.code: "change"
          services/orders/tests/order_test.code: "test"
        changed:
          services/orders/src/order.code: M
          services/orders/tests/order_test.code: M
        expect: pass

  - id: VAL-SEMANTIC-REVIEW
    name: Semantic architecture review
    type: semantic
    implementation: semantic_validators:semantic_review
    description: >
      Emits a review request (rubric + questions) for rules that need architectural judgment and consumes the
      semantic_judgments a reviewer (agent or human) records. The engine never calls an LLM itself.
    checkpoints: [code_review, testing, ci]
    self_tests:
      - name: no judgment yields needs_review
        rule_id: ARCH-001
        files: { services/orders/src/order.code: "change" }
        expect: needs_review
      - name: failing judgment yields fail
        rule_id: ARCH-001
        files: { services/orders/src/order.code: "change" }
        artifacts:
          semantic_judgments:
            - { rule_id: ARCH-001, verdict: fail, rationale: "Reaches into another service's internals", reviewer: { type: agent, id: review-agent } }
        expect: fail

  - id: VAL-PROJECT-LAYERS
    name: csproj layer dependencies
    type: deterministic
    implementation: project_validators:layer_dependencies
    description: ProjectReferences follow profile.layer_dependencies; every project under src/ and tests/ is classified.
    checkpoints: [pre_commit, code_review, ci]
    params: &csproj
      manifest_globs: ["src/**/*.csproj", "tests/**/*.csproj"]
      reference_patterns:
        - 'ProjectReference\s+Include\s*=\s*"(?P<ref>[^"]+)"'
      package_patterns:
        - 'PackageReference\s+Include\s*=\s*"(?P<name>[^"]+)"'
    self_tests:
      - name: domain referencing its infrastructure fails
        files:
          src/Ordering.Domain/Ordering.Domain.csproj: '<Project><ItemGroup><ProjectReference Include="..\Ordering.Infrastructure\Ordering.Infrastructure.csproj" /></ItemGroup></Project>'
        expect: fail
      - name: API referencing its domain, infrastructure and shared libraries passes
        files:
          src/Ordering.API/Ordering.API.csproj: '<Project><ItemGroup><ProjectReference Include="..\Ordering.Domain\Ordering.Domain.csproj" /><ProjectReference Include="..\Ordering.Infrastructure\Ordering.Infrastructure.csproj" /><ProjectReference Include="..\EventBusRabbitMQ\EventBusRabbitMQ.csproj" /></ItemGroup></Project>'
        expect: pass

  - id: VAL-SERVICE-ISOLATION
    name: Projects do not reference another service's projects
    type: deterministic
    implementation: project_validators:service_isolation
    description: A project of one service must not reference a project of another service; shared libraries are fine.
    checkpoints: [pre_commit, code_review, ci]
    params: *csproj
    self_tests:
      - name: Basket.API referencing Ordering.Domain fails
        files:
          src/Basket.API/Basket.API.csproj: '<Project><ItemGroup><ProjectReference Include="..\Ordering.Domain\Ordering.Domain.csproj" /></ItemGroup></Project>'
        expect: fail
      - name: Basket.API referencing a shared library passes
        files:
          src/Basket.API/Basket.API.csproj: '<Project><ItemGroup><ProjectReference Include="..\EventBusRabbitMQ\EventBusRabbitMQ.csproj" /></ItemGroup></Project>'
        expect: pass

  - id: VAL-DOMAIN-PACKAGES
    name: The domain layer stays free of persistence and web packages
    type: deterministic
    implementation: project_validators:forbidden_packages
    description: Rejects the packages in profile.forbidden_packages_by_layer in domain projects.
    checkpoints: [pre_commit, code_review, ci]
    params: *csproj
    self_tests:
      - name: EF Core in Ordering.Domain fails
        files:
          src/Ordering.Domain/Ordering.Domain.csproj: '<Project><ItemGroup><PackageReference Include="Microsoft.EntityFrameworkCore" /></ItemGroup></Project>'
        expect: fail
      - name: MediatR in Ordering.Domain passes
        files:
          src/Ordering.Domain/Ordering.Domain.csproj: '<Project><ItemGroup><PackageReference Include="MediatR" /></ItemGroup></Project>'
        expect: pass
