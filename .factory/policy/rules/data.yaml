kind: RuleSet
schema_version: 1
category: data
description: Data ownership.
rules:

  - id: DATA-001
    title: A service connects only to the datastores it owns
    category: data
    severity: high
    status: active
    version: 1.0.0
    owner: architecture
    description: >
      Each datastore has one owning service (profile services[].owns_datastores). Code of another service
      must not connect to it; it asks the owner through its API or reacts to its events.
    rationale: >
      A second writer or reader on a service's database freezes its schema and bypasses its rules.
    applicability:
      include: ["**/*"]
      exclude: ["**/*.md", "**/*.lock"]
      note: Takes effect once the profile lists services with owns_datastores; until then nothing has an owner.
    checkpoints:
      pre_commit:  { enabled: true, enforcement: block, scope: changed }
      code_review: { enabled: true, enforcement: block, scope: changed }
      testing:     { enabled: false }
      ci:          { enabled: true, enforcement: block, scope: all }
    validation:
      mode: deterministic
      validators: [VAL-DB-OWNERSHIP]
    patterns: []
    required_evidence:
      - { type: validator_output, checkpoints: [pre_commit, code_review, ci], on_missing: block }
    remediation:
      summary: Use the owning service's API or events instead of its datastore.
      steps:
        - Remove the connection to the other service's datastore.
        - Call the owner's API for queries, or subscribe to its events and keep a local copy of what you need.
    human_review_required: false
    tags: [ownership]
