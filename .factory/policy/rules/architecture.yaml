kind: RuleSet
schema_version: 1
category: architecture
description: Boundaries between services, layers and generated code.
rules:

  - id: ARCH-004
    title: Changes respect service and layer boundaries
    category: architecture
    severity: high
    status: active
    version: 1.0.0
    owner: architecture
    description: >
      Code depends only on what its layer may depend on (profile layer_dependencies) and reaches another
      service only through that service's published interface (its API, its events, its client library),
      never through its internals.
    rationale: >
      Boundaries are what let a service change, deploy and fail on its own. One shortcut across them couples
      two teams' release cycles.
    applicability:
      include: ["**/*"]
      exclude: ["**/*.md"]
      note: Narrow `include` to the source trees once the profile lists the projects.
    checkpoints:
      pre_commit:  { enabled: false, note: Semantic rules are not evaluated pre-commit. }
      code_review: { enabled: true, enforcement: warn, scope: changed }
      testing:     { enabled: false }
      ci:          { enabled: false }
    validation:
      mode: semantic
      validators: [VAL-SEMANTIC-REVIEW]
      semantic:
        rubric: >
          Using the profile (projects, services, layers, layer_dependencies), judge whether the change keeps
          dependencies pointing the allowed way. Pass when every new import, call or reference stays inside
          the service or goes through another service's published interface, and inner layers do not depend
          on outer ones. Fail when the change imports another service's internal module, shares its data
          model or storage, or makes an inner layer depend on an outer one.
        questions:
          - Does the change add a dependency from one service on another service's internals?
          - Does a lower layer (for example domain) now depend on a higher one (for example presentation or infrastructure)?
          - Is a new cross-service interaction done through a published interface?
        pass_criteria: No new dependency crosses a service boundary through internals or points against the layer order.
    patterns: [PAT-INTEGRATION-EVENT-CONTRACT, PAT-TRANSACTIONAL-OUTBOX]
    required_evidence:
      - { type: validator_output, checkpoints: [code_review], on_missing: warn }
    remediation:
      summary: Depend on the other service's published interface, or invert the dependency behind an interface owned by the inner layer.
      steps:
        - Replace the internal import with a call to the owning service's API, event or client library.
        - For a layer violation, define the interface in the inner layer and implement it in the outer one.
    human_review_required: false
    tags: [boundaries, layering]

  - id: ARCH-008
    title: Generated files are regenerated, not edited by hand
    category: architecture
    severity: medium
    status: active
    version: 1.0.0
    owner: architecture
    description: >
      A file that carries a generated-code marker is produced by a tool. Change its source (schema, template,
      model) or the generator and regenerate it; do not edit the output.
    rationale: >
      A hand edit to generated output disappears on the next regeneration and makes the output disagree with
      its source in the meantime.
    applicability:
      include: ["**/*"]
      exclude: ["**/*.md"]
    checkpoints:
      pre_commit:  { enabled: true, enforcement: warn, scope: changed }
      code_review: { enabled: true, enforcement: warn, scope: changed, note: A regenerated file also trips this; the warning asks the author to confirm it was regenerated. }
      testing:     { enabled: false }
      ci:          { enabled: false, note: Only changes matter; a full scan would list every generated file. }
    validation:
      mode: deterministic
      validators: [VAL-GENERATED-MARKER]
    patterns: []
    required_evidence:
      - { type: validator_output, checkpoints: [pre_commit, code_review], on_missing: warn }
    remediation:
      summary: Revert the hand edit, change the generator input and regenerate the file.
      steps:
        - Find the generator and its input (the marker line usually names it).
        - Change the input, run the generator and commit both.
    human_review_required: false
    tags: [generated-code]

  - id: ARCH-001
    title: Layer dependencies point inward and the domain stays pure
    category: architecture
    severity: critical
    status: active
    version: 1.0.0
    owner: architecture
    description: >
      Project references must follow the profile's layer matrix (domain <- infrastructure <- application;
      presentation and shared libraries depend only on shared libraries). The domain layer must not
      reference persistence, transport or hosting packages. Every project must be classified in the profile.
    rationale: >
      A layered service (Domain / Infrastructure / Api projects) keeps business
      invariants testable and independent of EF Core, RabbitMQ and ASP.NET Core. Inverted dependencies
      erode that boundary silently; unclassified projects escape every other rule.
    applicability:
      include: ["**/*.csproj"]
    checkpoints:
      pre_commit:  { enabled: true, enforcement: block, scope: changed }
      code_review: { enabled: true, enforcement: block, scope: changed }
      testing:     { enabled: false }
      ci:          { enabled: true, enforcement: block, scope: all }
    validation:
      mode: deterministic
      validators: [VAL-LAYER-DEPENDENCIES, VAL-DOMAIN-PACKAGES]
    patterns: [PAT-LAYERED-DDD-SERVICE]
    required_evidence:
      - { type: validator_output, checkpoints: [pre_commit, code_review, ci], on_missing: block }
    remediation:
      summary: Reverse the dependency (define an interface in the inner layer, implement it outward). A new project is classified in {topology_file} under policy.projects (an existing type, layer and service, or a new service under policy.services); the classes themselves are in {profile_file}.
      steps:
        - Remove the offending ProjectReference/PackageReference.
        - Define the abstraction in the domain (e.g. IOrderRepository) and implement it in infrastructure.
        - For a new project, declare it in {topology_file} under policy.projects with name, path, type, layer and service.
      references: []
    human_review_required: false
    tags: [layering, ddd]

  - id: ARCH-002
    title: Services do not reference other services' projects
    category: architecture
    severity: critical
    status: active
    version: 1.0.0
    owner: architecture
    description: >
      A project owned by one service (bounded context) must not take a ProjectReference on a project owned
      by another service. Only projects the profile marks as shared libraries (layer: shared) may be
      referenced across services.
    rationale: >
      Compile-time coupling between services defeats independent deployability and leaks domain models
      across bounded contexts. Services integrate through HTTP/gRPC APIs and integration events.
    applicability:
      include: ["**/*.csproj"]
      project_types: [api, web, worker, domain, infrastructure]
    checkpoints:
      pre_commit:  { enabled: true, enforcement: block, scope: changed }
      code_review: { enabled: true, enforcement: block, scope: changed }
      testing:     { enabled: false }
      ci:          { enabled: true, enforcement: block, scope: all }
    validation:
      mode: deterministic
      validators: [VAL-SERVICE-ISOLATION]
    patterns: [PAT-DATABASE-PER-SERVICE]
    required_evidence:
      - { type: validator_output, checkpoints: [pre_commit, code_review, ci], on_missing: block }
    remediation:
      summary: Replace the project reference with an API call through a typed HttpClient/gRPC client or an integration event.
      steps:
        - Remove the cross-service ProjectReference.
        - If data is needed synchronously, call the owning service's versioned API via a typed client.
        - If a reaction is needed, subscribe to the owning service's integration event.
        - If a type is genuinely shared, move it to a shared library with a versioned contract.
      references: []
    human_review_required: false
    tags: [bounded-context, coupling]

  - id: ARCH-003
    title: Every service host uses ServiceDefaults
    category: architecture
    severity: high
    status: active
    version: 1.0.0
    owner: architecture
    description: >
      API, web and worker hosts must call builder.AddServiceDefaults() (or AddBasicServiceDefaults()) and
      app.MapDefaultEndpoints() in Program.cs.
    rationale: >
      ServiceDefaults centralizes OpenTelemetry, health checks, service discovery and the standard HTTP
      resilience handler. Hosts that skip it are invisible to the dashboard and lack resilience.
    applicability:
      include: ["**/Program.cs"]
      project_types: [api, web, worker]
    checkpoints:
      pre_commit:  { enabled: true, enforcement: block, scope: changed }
      code_review: { enabled: true, enforcement: block, scope: changed }
      testing:     { enabled: false }
      ci:          { enabled: true, enforcement: block, scope: all }
    validation:
      mode: deterministic
      validators: [VAL-SERVICE-DEFAULTS]
    patterns: [PAT-SERVICE-DEFAULTS-HOST]
    required_evidence:
      - { type: validator_output, checkpoints: [pre_commit, code_review, ci], on_missing: block }
    remediation:
      summary: Reference ServiceDefaults and call AddServiceDefaults()/MapDefaultEndpoints() in Program.cs.
      steps:
        - Add a ProjectReference to src/ServiceDefaults.
        - Call builder.AddServiceDefaults() immediately after CreateBuilder.
        - Call app.MapDefaultEndpoints() after Build().
      references: []
    human_review_required: false
    tags: [aspire, hosting]

  - id: ARCH-005
    title: New capabilities are placed in the right bounded context with sound aggregates
    category: architecture
    severity: high
    status: active
    version: 1.0.0
    owner: architecture
    description: >
      New projects, aggregates, or domain models must belong to the bounded context that owns the
      capability and data. Aggregates enforce their invariants through behavior (not public setters),
      and cross-aggregate references are by identity.
    rationale: >
      Misplaced capabilities (one feature's logic split between two services) create shared
      ownership of data and invariants. This requires human architectural judgment.
    applicability:
      include:
        - "**/*.csproj"
        - "**/*.Domain/**/*.cs"
        - "**/Model/**/*.cs"
        - "**/Models/**/*.cs"
      project_types: [api, web, worker, domain, infrastructure]
    checkpoints:
      pre_commit:  { enabled: false, note: Semantic rules are not evaluated pre-commit. }
      code_review: { enabled: true, enforcement: warn, scope: changed }
      testing:     { enabled: false }
      ci:          { enabled: true, enforcement: warn, scope: changed }
    validation:
      mode: semantic
      validators: [VAL-SEMANTIC-REVIEW]
      semantic:
        rubric: >
          Decide whether new or changed models live in the bounded context that owns the capability and its
          data (see docs/architecture/services.md). For aggregates, check invariants are enforced through
          methods, collections are encapsulated, and other aggregates are referenced by ID.
        questions:
          - Which bounded context owns this capability and its data? Is the code placed there?
          - Are aggregate invariants enforced by behavior rather than public setters?
          - Does the change introduce shared ownership of data across services?
        pass_criteria: Correct context ownership and encapsulated aggregates, confirmed by a human architect.
    patterns: [PAT-LAYERED-DDD-SERVICE]
    required_evidence:
      - { type: validator_output, checkpoints: [code_review, ci], on_missing: warn }
      - { type: human_approval, checkpoints: [code_review], on_missing: warn, description: Architect sign-off on context placement. }
    remediation:
      summary: Move the capability into its owning bounded context or record the decision in an ADR with architect approval.
      steps:
        - Identify the owning service from docs/architecture/services.md.
        - Move models/logic there; expose data to other contexts via APIs or events.
        - Record significant boundary decisions as an ADR and link it in the PR.
      references: []
    human_review_required: true
    tags: [ddd, bounded-context]

  - id: ARCH-006
    title: Package versions are managed centrally
    category: architecture
    severity: medium
    status: active
    version: 1.0.0
    owner: architecture
    description: >
      PackageReference items must not declare Version or VersionOverride; versions are defined once in
      Directory.Packages.props (ManagePackageVersionsCentrally=true).
    rationale: >
      Central package management keeps dependency versions consistent across services and makes security
      patching a one-line change.
    applicability:
      include: ["**/*.csproj"]
      exclude: ["src/ClientApp/**", "src/HybridApp/**", "tests/ClientApp.UnitTests/**"]
      note: The .NET MAUI apps (ClientApp, HybridApp) pin workload-specific package versions outside Directory.Packages.props.
    checkpoints:
      pre_commit:  { enabled: true, enforcement: warn, scope: changed }
      code_review: { enabled: true, enforcement: block, scope: changed }
      testing:     { enabled: false }
      ci:          { enabled: true, enforcement: block, scope: all }
    validation:
      mode: deterministic
      validators: [VAL-CPM-NO-INLINE-VERSION]
    patterns: [PAT-CENTRAL-PACKAGE-MANAGEMENT]
    required_evidence:
      - { type: validator_output, checkpoints: [pre_commit, code_review, ci], on_missing: block }
    remediation:
      summary: Remove the Version attribute and add/update a PackageVersion entry in Directory.Packages.props.
      steps:
        - Delete Version="..." from the PackageReference.
        - Add <PackageVersion Include="Name" Version="x.y.z" /> to Directory.Packages.props if missing.
      references: []
    human_review_required: false
    tags: [dependencies, supply-chain]

  - id: ARCH-007
    title: Integration events are immutable, conventionally named records
    category: architecture
    severity: high
    status: active
    version: 1.0.0
    owner: architecture
    description: >
      Types deriving from IntegrationEvent must be records whose names end with 'IntegrationEvent'.
    rationale: >
      RabbitMQEventBus routes by CLR type name, so the name is the wire contract. Mutable class-based
      events invite in-place mutation after publication and break replay/outbox semantics.
    applicability:
      include: ["**/*.cs"]
    checkpoints:
      pre_commit:  { enabled: true, enforcement: block, scope: changed }
      code_review: { enabled: true, enforcement: block, scope: changed }
      testing:     { enabled: false }
      ci:          { enabled: true, enforcement: block, scope: all }
    validation:
      mode: deterministic
      validators: [VAL-INTEGRATION-EVENT-CONTRACT]
    patterns: [PAT-INTEGRATION-EVENT-CONTRACT]
    required_evidence:
      - { type: validator_output, checkpoints: [pre_commit, code_review, ci], on_missing: block }
    remediation:
      summary: "Declare the event as 'public record <Name>IntegrationEvent(...) : IntegrationEvent;'."
      steps:
        - Convert the class to a positional record with init-only data.
        - Rename to end with IntegrationEvent and update every subscriber (name is the routing key).
      references: []
    human_review_required: false
    tags: [events, contracts]
