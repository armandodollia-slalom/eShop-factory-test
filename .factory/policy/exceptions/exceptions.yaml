# Exception register: the only way to waive an architecture finding. Inline suppressions are not supported.
# Every exception names one rule and path globs, is approved by a role allowed for the rule's severity
# (policy.yaml exceptions.approver_roles_by_severity) and expires (max policy.yaml exceptions.max_duration_days).
#
#   - id: EXC-0001
#     rule_id: SEC-001
#     scope: { paths: ["services/legacy/**"] }
#     justification: Why the rule cannot be met today.
#     risk: medium                       # low | medium | high | critical
#     compensating_controls: [What limits the risk meanwhile.]
#     requested_by: team-name
#     approved_by: person-or-board
#     approver_role: tech-lead
#     ticket: link-or-id
#     created: "2026-01-01"
#     expires: "2026-03-31"
kind: ExceptionRegister
schema_version: 1
exceptions:

# Proposals from the author-architecture-policy dry run (2026-11-12): true violations already in upstream
# dotnet/eShop. approved_by is empty on purpose: an exception takes effect only once a person in
# approver_role signs it (policy.yaml exceptions). Until then these findings block at ci and on changed files.

  - id: EXC-0001
    rule_id: API-002
    scope: { paths: ["src/Catalog.API/**"] }
    justification: Catalog write endpoints (POST/PUT/DELETE /api/catalog/items) are anonymous upstream; securing them needs a write policy and client changes.
    risk: critical
    compensating_controls: [Catalog.API is reachable only inside the Aspire/test-stack network in this deployment.]
    requested_by: factory-onboarding
    approved_by: ""
    approver_role: architecture-board
    ticket: ""
    created: "2026-11-12"
    expires: "2027-02-10"

  - id: EXC-0002
    rule_id: SEC-002
    scope: { paths: ["src/eShop.ServiceDefaults/AuthenticationExtensions.cs"], match: "ValidateAudience" }
    justification: The shared JWT setup disables audience validation upstream.
    risk: critical
    compensating_controls: [Single trusted issuer (Identity.API).]
    requested_by: factory-onboarding
    approved_by: ""
    approver_role: architecture-board
    ticket: ""
    created: "2026-11-12"
    expires: "2027-02-10"

  - id: EXC-0003
    rule_id: SEC-004
    scope: { paths: ["src/Identity.API/Program.cs"] }
    justification: Identity.API uses AddDeveloperSigningCredential upstream (sample deployment).
    risk: high
    compensating_controls: [Development and test deployments only.]
    requested_by: factory-onboarding
    approved_by: ""
    approver_role: architecture-board
    ticket: ""
    created: "2026-11-12"
    expires: "2027-02-10"

  - id: EXC-0004
    rule_id: SEC-001
    scope: { paths: ["src/WebApp/Extensions/Extensions.cs", "src/WebhookClient/Extensions/Extensions.cs", "src/ClientApp/Services/Settings/SettingsService.cs", "src/Identity.API/Configuration/Config.cs"], match: "(?i)secret" }
    justification: Sample OIDC client secrets ("secret") are literals upstream.
    risk: high
    compensating_controls: [The values are the public sample secrets of the reference application.]
    requested_by: factory-onboarding
    approved_by: ""
    approver_role: architecture-board
    ticket: ""
    created: "2026-11-12"
    expires: "2027-02-10"

  - id: EXC-0005
    rule_id: DATA-003
    scope: { paths: ["src/OrderProcessor/Services/GracePeriodManagerService.cs"] }
    justification: The grace-period worker publishes GracePeriodConfirmedIntegrationEvent directly upstream (no outbox in OrderProcessor).
    risk: medium
    compensating_controls: [The event is re-derived from order state on the next grace-period pass.]
    requested_by: factory-onboarding
    approved_by: ""
    approver_role: tech-lead
    ticket: ""
    created: "2026-11-12"
    expires: "2027-02-10"
