# An approved pattern: what "right" looks like, with examples the review agent hands to code agents.
# File name = pattern id without PAT-, lower case. A pattern and its rules must reference each other.
kind: Pattern
schema_version: 1
id: PAT-SECRETS-CONFIGURATION
name: Secrets from configuration, never from source
category: security
summary: Credentials are injected at run time (environment, secret store, mounted file) and never committed.
intent: Keep credentials out of version control and rotate them without a code change.
rules:
- SEC-001
guidance:
- Read every credential from the process environment or the platform's secret store.
- Commit only placeholders (an .env.example with empty values), never working values.
- If a secret was committed, rotate it; removing the line does not remove it from history.
# Files of this repository that show the pattern done well: [{path, symbol, description}]. Selfcheck verifies they exist.
exemplars: []
examples:
- id: secret-from-environment
  title: Secret read from the environment
  kind: approved
  language: text
  code: |
    db_password = env("DB_PASSWORD")
  explanation: The value comes from the deployment, not the repository.
- id: hard-coded-secret
  title: Hard-coded credential
  kind: anti_pattern
  language: text
  code: |
    db_password = "S3cr3t-Pa55word!"
  explanation: A committed credential stays in history for every clone.
