# Generated by `factory teststack publish` from src/eShop.AppHost/eShop.AppHost.csproj (aspire publish, TestStack=true) and the
# declared test-only overrides in .factory/app.json (stack.publishOverrides). Do not edit: change the AppHost or
# the overrides and publish again. `factory teststack drift` fails when this file is out of date.
services:
  teststack-dashboard:
    image: mcr.microsoft.com/dotnet/nightly/aspire-dashboard:13.6
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - aspire
    restart: unless-stopped
    extra_hosts:
      host.docker.internal: host-gateway
  redis:
    image: docker.io/library/redis:8.6
    command:
      - -c
      - redis-server --requirepass $$REDIS_PASSWORD
    entrypoint:
      - /bin/sh
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    expose:
      - "6379"
    networks:
      - aspire
    ports:
      - ${REDIS_HOST_PORT:-28379}:6379
    restart: unless-stopped
    extra_hosts:
      host.docker.internal: host-gateway
  eventbus:
    image: docker.io/library/rabbitmq:4.3
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: ${EVENTBUS_PASSWORD}
    expose:
      - "5672"
    networks:
      - aspire
    ports:
      - ${EVENTBUS_HOST_PORT:-28672}:5672
    restart: unless-stopped
    extra_hosts:
      host.docker.internal: host-gateway
  postgres:
    image: docker.io/ankane/pgvector:latest
    environment:
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    networks:
      - aspire
    ports:
      - ${POSTGRES_HOST_PORT:-28432}:5432
    restart: unless-stopped
    extra_hosts:
      host.docker.internal: host-gateway
  identity-api:
    image: ${IDENTITY_API_IMAGE}
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: in_memory
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "8080"
      ConnectionStrings__identitydb: Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=identitydb
      IDENTITYDB_HOST: postgres
      IDENTITYDB_PORT: "5432"
      IDENTITYDB_USERNAME: postgres
      IDENTITYDB_PASSWORD: ${POSTGRES_PASSWORD}
      IDENTITYDB_URI: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/identitydb
      IDENTITYDB_JDBCCONNECTIONSTRING: jdbc:postgresql://postgres:5432/identitydb
      IDENTITYDB_DATABASENAME: identitydb
      BasketApiClient: http://basket-api:8080
      OrderingApiClient: http://ordering-api:8080
      WebhooksApiClient: http://webhooks-api:8080
      WebhooksWebClient: http://localhost:${WEBHOOKSCLIENT_HOST_PORT:-28086}
      WebAppClient: http://localhost:${WEBAPP_HOST_PORT:-28080}
