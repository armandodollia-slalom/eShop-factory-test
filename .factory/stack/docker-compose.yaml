# The eShop test stack: the whole application as production runs it (the AppHost's resource graph in
# src/eShop.AppHost/AppHost.cs), one container per service, built with `dotnet publish -t:PublishContainer`
# (stack.build in .factory/config.json). Host ports and every browser-facing URL come from the slot variables
# (stack.ports), so several slots run side by side. Identity is reached as host.docker.internal:<identity port>
# from the containers and from the test browser (mapped to 127.0.0.1 by playwright.teststack.config.ts), so the
# OIDC issuer is the same for both. Seeding__Disabled=true: scenario files own the data, EF migrations still run.
name: eshop-factory-test-teststack

x-service: &service
  restart: unless-stopped
  extra_hosts:
    host.docker.internal: host-gateway
  environment: &env
    ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    ASPNETCORE_HTTP_PORTS: "8080"

services:
  postgres:
    image: docker.io/ankane/pgvector:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "${POSTGRES_HOST_PORT:-28432}:5432"
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:8.6
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_HOST_PORT:-28379}:6379"
    restart: unless-stopped

  eventbus:
    image: docker.io/library/rabbitmq:4.3
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: "${EVENTBUS_PASSWORD}"
    ports:
      - "${EVENTBUS_HOST_PORT:-28672}:5672"
    restart: unless-stopped

  identity-api:
    <<: *service
    image: "${IDENTITY_API_IMAGE}"
    environment:
      <<: *env
      ConnectionStrings__identitydb: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=identitydb"
      BasketApiClient: "http://basket-api:8080"
      OrderingApiClient: "http://ordering-api:8080"
      WebhooksApiClient: "http://webhooks-api:8080"
      WebhooksWebClient: "http://localhost:${WEBHOOKSCLIENT_HOST_PORT:-28086}"
      WebAppClient: "http://localhost:${WEBAPP_HOST_PORT:-28080}"
      Seeding__Disabled: "${SEEDING_DISABLED:-true}"
    ports:
      - "${IDENTITY_API_HOST_PORT:-28081}:8080"
    depends_on: [postgres]

  basket-api:
    <<: *service
    image: "${BASKET_API_IMAGE}"
    environment:
      <<: *env
      ConnectionStrings__redis: "redis:6379,password=${REDIS_PASSWORD}"
      ConnectionStrings__eventbus: "amqp://guest:${EVENTBUS_PASSWORD}@eventbus:5672"
      Identity__Url: "http://host.docker.internal:${IDENTITY_API_HOST_PORT:-28081}"
    ports:
      - "${BASKET_API_HOST_PORT:-28083}:8080"
    depends_on: [redis, eventbus]

  catalog-api:
    <<: *service
    image: "${CATALOG_API_IMAGE}"
    environment:
      <<: *env
      ConnectionStrings__catalogdb: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=catalogdb"
      ConnectionStrings__eventbus: "amqp://guest:${EVENTBUS_PASSWORD}@eventbus:5672"
      Seeding__Disabled: "${SEEDING_DISABLED:-true}"
    ports:
      - "${CATALOG_API_HOST_PORT:-28082}:8080"
    depends_on: [postgres, eventbus]

  ordering-api:
    <<: *service
    image: "${ORDERING_API_IMAGE}"
    environment:
      <<: *env
      ConnectionStrings__orderingdb: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=orderingdb"
      ConnectionStrings__eventbus: "amqp://guest:${EVENTBUS_PASSWORD}@eventbus:5672"
      Identity__Url: "http://host.docker.internal:${IDENTITY_API_HOST_PORT:-28081}"
      Seeding__Disabled: "${SEEDING_DISABLED:-true}"
    ports:
      - "${ORDERING_API_HOST_PORT:-28084}:8080"
    depends_on: [postgres, eventbus]

  order-processor:
    <<: *service
    image: "${ORDER_PROCESSOR_IMAGE}"
    environment:
      <<: *env
      ConnectionStrings__orderingdb: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=orderingdb"
      ConnectionStrings__eventbus: "amqp://guest:${EVENTBUS_PASSWORD}@eventbus:5672"
    depends_on: [postgres, eventbus, ordering-api]

  payment-processor:
    <<: *service
    image: "${PAYMENT_PROCESSOR_IMAGE}"
    environment:
      <<: *env
      ConnectionStrings__eventbus: "amqp://guest:${EVENTBUS_PASSWORD}@eventbus:5672"
    depends_on: [eventbus]

  webhooks-api:
    <<: *service
    image: "${WEBHOOKS_API_IMAGE}"
    environment:
      <<: *env
      ConnectionStrings__webhooksdb: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=webhooksdb"
      ConnectionStrings__eventbus: "amqp://guest:${EVENTBUS_PASSWORD}@eventbus:5672"
      Identity__Url: "http://host.docker.internal:${IDENTITY_API_HOST_PORT:-28081}"
    ports:
      - "${WEBHOOKS_API_HOST_PORT:-28085}:8080"
    depends_on: [postgres, eventbus]

  webhooksclient:
    <<: *service
    image: "${WEBHOOKSCLIENT_IMAGE}"
    environment:
      <<: *env
      services__webhooks-api__http__0: "http://webhooks-api:8080"
      IdentityUrl: "http://host.docker.internal:${IDENTITY_API_HOST_PORT:-28081}"
      CallBackUrl: "http://localhost:${WEBHOOKSCLIENT_HOST_PORT:-28086}"
      WebhookClientOptions__SelfUrl: "http://webhooksclient:8080/"
    ports:
      - "${WEBHOOKSCLIENT_HOST_PORT:-28086}:8080"

  webapp:
    <<: *service
    image: "${WEBAPP_IMAGE}"
    environment:
      <<: *env
      services__basket-api__http__0: "http://basket-api:8080"
      services__catalog-api__http__0: "http://catalog-api:8080"
      services__ordering-api__http__0: "http://ordering-api:8080"
      ConnectionStrings__eventbus: "amqp://guest:${EVENTBUS_PASSWORD}@eventbus:5672"
      IdentityUrl: "http://host.docker.internal:${IDENTITY_API_HOST_PORT:-28081}"
      CallBackUrl: "http://localhost:${WEBAPP_HOST_PORT:-28080}"
    ports:
      - "${WEBAPP_HOST_PORT:-28080}:8080"
    depends_on: [eventbus, identity-api]
